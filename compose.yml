services:
  macos:
    image: dockurr/macos_Tahoe  
    container_name: macos_Tahoe
    environment:
      VERSION: "26"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_Set_Pass
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./macos:/storage
    restart: always
    stop_grace_period: never
